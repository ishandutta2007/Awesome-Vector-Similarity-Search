<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #070b19; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0c132c" />
      <stop offset="70%" stop-color="#111c40" />
      <stop offset="100%" stop-color="#070a1a" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #ec4899; #38bdf8; #a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e; #38bdf8; #a855f7; #f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-fx">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    .pill-anim-1 { animation: floatSlow 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatReverse 6s ease-in-out infinite; }
    .pill-anim-3 { animation: floatSlow 7s ease-in-out infinite; }
    .pill-anim-4 { animation: floatReverse 5.5s ease-in-out infinite; }
    .glow-aura { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Animated High-Dimensional Coordinate Grid Lines -->
  <g opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-dasharray="6 6" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#818cf8" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-dasharray="8 6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#818cf8" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-dasharray="6 6" />

    <line x1="150" y1="0" x2="150" y2="360" stroke="#38bdf8" stroke-dasharray="5 5" />
    <line x1="350" y1="0" x2="350" y2="360" stroke="#818cf8" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#c084fc" stroke-dasharray="6 6" />
    <line x1="850" y1="0" x2="850" y2="360" stroke="#818cf8" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#38bdf8" stroke-dasharray="5 5" />
  </g>

  <!-- Ambient Center Glow Aura (Behind Text) -->
  <circle cx="600" cy="180" r="280" fill="url(#center-glow)" class="glow-aura" />

  <!-- Animated Vector Graph Connections (Flow Lines) -->
  <g stroke-linecap="round">
    <!-- Top-left to bottom-right vector arc -->
    <path d="M 80,60 Q 300,30 480,110 T 800,90" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M 1120,300 Q 900,330 720,250 T 400,270" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;72" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Side clusters and dynamic vector rays -->
    <line x1="100" y1="120" x2="220" y2="70" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35" />
    <line x1="220" y1="70" x2="290" y2="150" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35" />
    <line x1="100" y1="120" x2="180" y2="220" stroke="#6366f1" stroke-width="1.2" opacity="0.35" />
    <line x1="960" y1="120" x2="1080" y2="80" stroke="#a855f7" stroke-width="1.2" opacity="0.35" />
    <line x1="1080" y1="80" x2="1140" y2="180" stroke="#ec4899" stroke-width="1.2" opacity="0.35" />
    <line x1="960" y1="120" x2="1020" y2="240" stroke="#a855f7" stroke-width="1.2" opacity="0.35" />
  </g>

  <!-- Pulsing Vector Nodes (Approximate Nearest Neighbors Graph) -->
  <g>
    <!-- Node 1 -->
    <circle cx="100" cy="120" r="5" fill="#38bdf8" opacity="0.8">
      <animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 2 -->
    <circle cx="220" cy="70" r="6" fill="#818cf8" opacity="0.8">
      <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 3 -->
    <circle cx="290" cy="150" r="4" fill="#38bdf8" opacity="0.7">
      <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <!-- Node 4 -->
    <circle cx="180" cy="220" r="5" fill="#a855f7" opacity="0.8">
      <animate attributeName="r" values="4;7;4" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <!-- Node 5 -->
    <circle cx="960" cy="120" r="5" fill="#a855f7" opacity="0.8">
      <animate attributeName="r" values="4;7;4" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 6 -->
    <circle cx="1080" cy="80" r="6" fill="#ec4899" opacity="0.8">
      <animate attributeName="r" values="5;8;5" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 7 -->
    <circle cx="1140" cy="180" r="4" fill="#818cf8" opacity="0.7">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 8 -->
    <circle cx="1020" cy="240" r="5" fill="#38bdf8" opacity="0.8">
      <animate attributeName="r" values="4;7;4" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Peripheral Dynamic Interactive Floating Tag Pills (Positioned in Corners to Keep Title Clear) -->
  <!-- Top Left Pill -->
  <g class="pill-anim-1">
    <rect x="40" y="32" width="180" height="32" rx="16" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="56" cy="48" r="4" fill="#38bdf8" />
    <text x="70" y="53" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="0.5">📐 Cosine &amp; Dot Product</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-anim-2">
    <rect x="975" y="32" width="185" height="32" rx="16" fill="url(#pill-grad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="991" cy="48" r="4" fill="#a855f7" />
    <text x="1005" y="53" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" letter-spacing="0.5">🕸️ HNSW &amp; IVF Indexing</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-anim-3">
    <rect x="40" y="296" width="195" height="32" rx="16" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="56" cy="312" r="4" fill="#818cf8" />
    <text x="70" y="317" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">🧠 Dense Embeddings</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-anim-4">
    <rect x="975" y="296" width="185" height="32" rx="16" fill="url(#pill-grad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="991" cy="312" r="4" fill="#ec4899" />
    <text x="1005" y="317" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8" letter-spacing="0.5">⚡ Billion-Scale RAG</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Unobscured & Crystal Clear) ================= -->
  <g id="foreground" filter="url(#shadow-fx)">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 85)">
      <rect x="-190" y="-15" width="380" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
        ⚡ 2026 CURATED ECOSYSTEM • OPEN-SOURCE &amp; SAAS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="1.2">
      Awesome Vector Similarity Search
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#e2e8f0" letter-spacing="0.6">
      Vector Databases • ANN Algorithms • Dense Embeddings • RAG Retrieval Engines
    </text>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(600, 240)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">⚡ Sub-ms Latency</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">🚀 Scale-Out Architecture</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">🔍 Hybrid BM25 + ANN</text>
      </g>
    </g>
  </g>
</svg>
